name: Test and Deploy Bel Lei's Calculator
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run check
      - name: Build static artifact
        run: |
          rm -rf dist
          mkdir -p dist/src/data
          cp index.html styles.css manifest.webmanifest sw.js dist/
          cp src/app.js src/engine.js src/store.js dist/src/
          cp src/data/oils.js src/data/additives.js src/data/fragrances.js src/data/reference.js dist/src/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
